name: CI

# Runs on every pull request and on pushes to main. Deliberately does NOT build
# native apps (no EAS build): that is slow, needs credentials, and is a manual
# release step. Everything here is deterministic and needs no secrets.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # One Node version everywhere. The backend needs >= 20.3 (AbortSignal.any) and
  # Expo SDK 54 / React Native 0.81 need >= 20.19, so 22 (current LTS) is safe.
  NODE_VERSION: '22'
  EXPO_NO_TELEMETRY: '1'

jobs:
  mobile:
    name: Mobile (typecheck, lint, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test -- --ci

  backend:
    name: Backend (typecheck, tests against MongoDB, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The tests run against a real MongoDB (an in-memory mongod). npm ci downloads its binary into this
      # directory, which is cached below so later runs do not download it again.
      MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.mongodb-binaries
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Cache the MongoDB binary used by the tests
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.mongodb-binaries
          key: mongodb-binary-${{ runner.os }}-${{ hashFiles('backend/package-lock.json') }}
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test -- --ci
      # The same build the Render service runs (see backend/README.md).
      - name: Production build
        run: npm run build

  security:
    name: Security checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # The Gemini key, SDK and endpoint, and the MongoDB driver and connection string, may exist only in backend/.
      - name: Trust boundary (no Gemini or MongoDB access in the mobile app)
        run: bash scripts/check-client-boundary.sh
      - name: No committed secret files
        run: |
          # .env.example templates are fine; real env files, keys and service-account JSON are not.
          leaked="$(git ls-files | grep -Ei '(^|/)\.env(\..+)?$|service-?account.*\.json$|firebase-adminsdk.*\.json$|\.(pem|p12|jks|key)$' | grep -v '\.example$' || true)"
          if [ -n "$leaked" ]; then
            echo "::error::Secret-looking files are tracked by git:"
            echo "$leaked"
            exit 1
          fi
